<text x="60" y="645" fill="#e8efec" font-size="17">Whole build: 795 split operations, 16,081 leaves from 256 shards. The largest shard (shard82, 198 GiB) ends up at ≤3.7 GiB per leaf.</text>
<text x="60" y="675" fill="#9db3ab" font-size="17">Splits only refine sorted order, so the leaves stay globally sorted and assembly concatenates them as before.</text>
<text x="60" y="705" fill="#9db3ab" font-size="17">Reshard stage 15 h 43 min. Assembly then peaked at ~940 GB of an 1,800 GB budget, where four earlier runs had OOM-crashed.</text>
