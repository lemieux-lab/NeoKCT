<text x="385" y="378" fill="#9db3ab" font-size="16">orange = Leu / Ser prefixes, far larger than the rest</text>
<rect x="837" y="74" width="42" height="254" rx="6" fill="none" stroke="#f0b429" stroke-width="3"/>
<text x="857.0" y="66" text-anchor="middle" fill="#f0b429" font-size="16">one shard = 5 files</text>
<rect x="1130" y="60" width="530" height="270" rx="10" fill="none" stroke="#e58468" stroke-width="2"/>
<text x="1150" y="96" fill="#e58468" font-size="22">Why uneven shards hurt</text>
<text x="1150" y="132" fill="#e8efec" font-size="18">256 shards x 5 roots = 1,280 files</text>
<text x="1150" y="164" fill="#e8efec" font-size="18">Assembly workers each take one shard:</text>
<text x="1150" y="196" fill="#e8efec" font-size="18">read its 5 files in full, build a merged copy</text>
<text x="1150" y="228" fill="#e8efec" font-size="18">Up to 8 workers at once, on adjacent shards</text>
<text x="1150" y="260" fill="#e8efec" font-size="18">Adjacent shards are the giants (Leu, Ser)</text>
<text x="1150" y="300" fill="#9db3ab" font-size="16">shard 82: 198 GiB combined, others ~1 MB</text>
<path d="M857.0,330 L857.0,392" stroke="#f0b429" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="40" y="410" fill="#e8efec" font-size="21">Merging one shard: a k-mer's row is its pieces from each root, concatenated in root order</text>
