<path d="M1065,520 L1065,560 L610,560" stroke="#9db3ab" stroke-width="1.5" fill="none"/>
<path d="M610,560 L610,586" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="40" y="590" width="1160" height="70" rx="8" fill="none" stroke="#3ecfa2" stroke-width="2"/>
<text x="60" y="620" fill="#3ecfa2" font-size="18">k-mer X, full row</text>
<text x="60" y="648" fill="#e8efec" font-size="19" font-family="'JetBrains Mono', monospace">(s12,3) (s40,1) (s530,2) (s1710,5) (s2201,1)</text>
<text x="1230" y="620" fill="#9db3ab" font-size="16">roots cover disjoint, ascending sample ranges,</text>
<text x="1230" y="646" fill="#9db3ab" font-size="16">so concatenating is enough, no re-sort</text>
<text x="1660" y="690" text-anchor="end" fill="#9db3ab" font-size="13">Counts, sample ids and shard positions illustrative. 5 roots, 256 shards, ~500 samples per root (derived), 198 GiB are real or derived from the build.</text>
