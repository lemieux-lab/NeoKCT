<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" font-family="'Archivo', sans-serif">
<rect x="0" y="0" width="1500" height="600" rx="14" fill="#151f1b"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9db3ab"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3ecfa2"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e58468"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f0b429"/></marker></defs>
<text x="30" y="48" fill="#e8efec" font-size="21" text-anchor="start" font-weight="700">Delta-encoded sorted k-mers: DeltaArray{UInt64, UInt32} (NArrays)</text>
<text x="30" y="76" fill="#9db3ab" font-size="15" text-anchor="start">An AA 10-mer packs into 50 bits of a UInt64, 5 bits per residue, first residue highest. Sorted neighbors are numerically close, so most entries cost one UInt32.</text>
<rect x="20" y="96" width="1460" height="48" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="40" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">#</text>
<text x="100" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">k-mer</text>
<text x="300" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">code (hex)</text>
<text x="570" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">stored in</text>
<text x="810" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">deltas[i]</text>
<text x="1020" y="126" fill="#8fb0e8" font-size="16" text-anchor="start" font-weight="700">why</text>
<rect x="20" y="152" width="1460" height="48" rx="10" fill="#2a2414" stroke="#f0b429" stroke-width="1.5"/>
<text x="40" y="183" fill="#9db3ab" font-size="16" text-anchor="start">1</text>
<text x="100" y="183" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPA</text>
<text x="300" y="183" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x00752E70781C0</text>
<text x="570" y="183" fill="#f0b429" font-size="16" text-anchor="start">UInt64 checkpoint</text>
<text x="810" y="183" fill="#f0b429" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0 (marker)</text>
<text x="1020" y="183" fill="#9db3ab" font-size="15" text-anchor="start">regular checkpoint, every 256th entry</text>
<rect x="20" y="208" width="1460" height="48" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="40" y="239" fill="#9db3ab" font-size="16" text-anchor="start">2</text>
<text x="100" y="239" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPQ</text>
<text x="300" y="239" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x00752E70781C5</text>
<text x="570" y="239" fill="#3ecfa2" font-size="16" text-anchor="start">UInt32 delta</text>
<text x="810" y="239" fill="#3ecfa2" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">+5</text>
<rect x="20" y="264" width="1460" height="48" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="40" y="295" fill="#9db3ab" font-size="16" text-anchor="start">3</text>
<text x="100" y="295" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPS</text>
<text x="300" y="295" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x00752E70781CF</text>
<text x="570" y="295" fill="#3ecfa2" font-size="16" text-anchor="start">UInt32 delta</text>
<text x="810" y="295" fill="#3ecfa2" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">+10</text>
<rect x="20" y="320" width="1460" height="48" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="40" y="351" fill="#9db3ab" font-size="16" text-anchor="start">4</text>
<text x="100" y="351" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSASL</text>
<text x="300" y="351" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x00752E70781EA</text>
<text x="570" y="351" fill="#3ecfa2" font-size="16" text-anchor="start">UInt32 delta</text>
<text x="810" y="351" fill="#3ecfa2" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">+27</text>
<rect x="20" y="376" width="1460" height="48" rx="10" fill="#2a2414" stroke="#f0b429" stroke-width="1.5"/>
<text x="40" y="407" fill="#9db3ab" font-size="16" text-anchor="start">5</text>
<text x="100" y="407" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">GWSESYLCSA</text>
<text x="300" y="407" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x0F1799F2511E0</text>
<text x="570" y="407" fill="#f0b429" font-size="16" text-anchor="start">UInt64 checkpoint</text>
<text x="810" y="407" fill="#f0b429" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0 (marker)</text>
<text x="1020" y="407" fill="#9db3ab" font-size="15" text-anchor="start">gap of 257,452,018,601,974 &gt; typemax(UInt32), promoted</text>
<rect x="20" y="432" width="1460" height="48" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="40" y="463" fill="#9db3ab" font-size="16" text-anchor="start">6</text>
<text x="100" y="463" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">GWSESYLCSG</text>
<text x="300" y="463" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">0x0F1799F2511E7</text>
<text x="570" y="463" fill="#3ecfa2" font-size="16" text-anchor="start">UInt32 delta</text>
<text x="810" y="463" fill="#3ecfa2" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">+7</text>
<text x="30" y="518" fill="#9db3ab" font-size="15" text-anchor="start">Reading entry i: jump to its regular checkpoint (regular_cp_idx), then add deltas forward. A 0 in deltas means "take the next checkpoint" instead of adding.</text>
<text x="30" y="544" fill="#9db3ab" font-size="15" text-anchor="start">Random access costs at most 255 additions, a sequential walk one per k-mer, and a gap too big for UInt32 just becomes another checkpoint.</text>
<text x="30" y="570" fill="#9db3ab" font-size="13" text-anchor="start">Codes and deltas are the real AAAlphabet encodings of these k-mers. Which entry lands on a regular checkpoint is illustrative.</text>
</svg>