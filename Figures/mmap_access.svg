<text x="890" y="656" fill="#e8efec" font-size="18">1,245 peptides in 0.5 s, load time is the whole cost</text>
<text x="1660" y="692" text-anchor="end" fill="#9db3ab" font-size="13">Derived, not measured: block ~2.4 KB = 64 x 37.76 B, so a 1 MB read spans a few hundred blocks. Cell counts and positions illustrative, not to scale.</text>
